name: Build bundled plugin docs

# The SignalK plugin ships the built MkDocs site under plugin/public/.
# Rather than failing when the committed copy is stale, this job rebuilds it and
# commits the result back (to the PR branch, or to main on direct pushes), so the
# bundle is always in sync and nobody has to run `npm run build-docs` by hand.
# Commits made with GITHUB_TOKEN do not re-trigger workflows, so there is no loop.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'plugin/scripts/**'
      - 'plugin/public/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - 'plugin/scripts/**'
      - 'plugin/public/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch tip (PR source branch, or main on push) so the
          # rebuilt bundle can be pushed back to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild bundled docs
        run: |
          mkdocs build --strict -d plugin/public/
          node plugin/scripts/gen-info.js   # regenerate public/info.json (ubuntu runner has node preinstalled)

      - name: Commit the bundle if it changed
        # Only same-repo pushes/PRs can write back; a fork PR just verifies the
        # build (main self-heals when the PR merges).
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -n "$(git status --porcelain -- plugin/public/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add plugin/public/
            git commit -m "chore: rebuild plugin/public docs bundle [skip ci]"
            git push
            echo "Rebuilt and committed plugin/public/."
          else
            echo "plugin/public/ already up to date."
          fi
